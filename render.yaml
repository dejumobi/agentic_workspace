services:
  - type: web
    name: mofeplay-voice-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: VOICE_SERVICE_TOKEN
        sync: false
  - type: web
    name: mofeplay-feedback-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_GENAI_MODEL
        value: gemini-2.5-flash
      - key: MUSIC_TUTOR_PROXY_TOKEN
        sync: false
      - key: MUSIC_TUTOR_API_URL
        value: https://mofeplay-voice-engine.onrender.com/synthesize
      - key: VOICE_SERVICE_TOKEN
        sync: false